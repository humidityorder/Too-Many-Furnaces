plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"toomanyfurnaces" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// The Forge and NeoForge bootstrap classes live next to the shared sources but must never be
// compiled into the Fabric jar.
sourceSets {
	main {
		java {
			exclude 'dev/mytechnology/toomanyfurnaces/forge/**'
			exclude 'dev/mytechnology/toomanyfurnaces/neoforge/**'
		}
	}

	client {
		java {
			exclude 'dev/mytechnology/toomanyfurnaces/forge/**'
			exclude 'dev/mytechnology/toomanyfurnaces/neoforge/**'
		}
	}
}

// The Forge and NeoForge subprojects ship these instead, keep them out of the Fabric jars.
sourceSets.main.resources.exclude 'META-INF/neoforge.mods.toml'
sourceSets.main.resources.exclude 'META-INF/mods.toml'
sourceSets.client.resources.exclude 'META-INF/neoforge.mods.toml'
sourceSets.client.resources.exclude 'META-INF/mods.toml'

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
			pom {
				name = "Too Many Furnaces"
				description = "A Fabric 26.2 reimplementation inspired by Better Furnaces Reforged."
				licenses {
					license {
						name = "MIT License"
						url = "https://opensource.org/licenses/MIT"
					}
				}
			}
		}
	}

	repositories {
	}
}
